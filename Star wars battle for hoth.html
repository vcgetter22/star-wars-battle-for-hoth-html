<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Battle for Hoth">
<title>Battle for Hoth - Tactical Tower Defense</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b1528; color: #e2f1ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none;
  }
  #app {
    display: flex; flex-direction: column; width: 100vw; height: 100vh;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  #topbar {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, #162a45, #0d1a2d);
    border-bottom: 2px solid #2e5c8a; padding: 6px 10px; font-size: 13px; flex-wrap: wrap; gap: 6px;
  }
  .stat-group { display: flex; gap: 12px; align-items: center; font-weight: 700; }
  .cp-badge { color: #ffd166; }
  .shield-badge { color: #4cc9f0; }
  .wave-badge { color: #ff6b6b; }
  select, button {
    background: #1b365d; color: #fff; border: 1px solid #4cc9f0;
    border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button.active { background: #f77f00; border-color: #fcbf49; color: #000; }
  #canvas-wrap { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #cde4f5; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #bottombar {
    display: flex; justify-content: space-between; align-items: center;
    background: #0d1a2d; border-top: 2px solid #2e5c8a; padding: 6px 8px; gap: 6px; overflow-x: auto;
  }
  .build-btn {
    display: flex; flex-direction: column; align-items: center; min-width: 68px;
    padding: 5px 6px; background: #152944; border: 1px solid #3a6ea5; border-radius: 6px; color: #d8ecff; font-size: 11px;
  }
  .build-btn.selected { background: #2b580c; border-color: #80ed99; color: #fff; }
  .build-btn span.cost { color: #ffd166; font-size: 10px; margin-top: 2px; }
  #inspector {
    position: absolute; bottom: 8px; right: 8px; background: rgba(11, 21, 40, 0.92);
    border: 1px solid #4cc9f0; border-radius: 8px; padding: 8px 10px; font-size: 12px;
    display: none; flex-direction: column; gap: 5px; min-width: 190px;
  }
  .inspector-row { display: flex; justify-content: space-between; gap: 6px; }
  #toast {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(13, 26, 45, 0.9); border: 1px solid #ffd166; color: #ffd166;
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
    pointer-events: none; opacity: 0; transition: opacity 0.25s;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="stat-group">
      <span class="cp-badge">CP: <span id="cp-val">250</span></span>
      <span class="shield-badge">Shield: <span id="shield-val">100</span>%</span>
      <span class="wave-badge">Wave: <span id="wave-val">1/10</span></span>
      <span>Score: <span id="score-val">0</span></span>
    </div>
    <div class="stat-group">
      <select id="map-select" title="Select Map">
        <option value="0">Map 1: Echo Perimeter (Classic)</option>
        <option value="1">Map 2: Twin Ridge Choke</option>
        <option value="2">Map 3: Ice Cavern Labyrinth (New)</option>
        <option value="3">Map 4: Dual Generator Core (New)</option>
        <option value="4">Map 5: Outpost Beta Blitz (New)</option>
      </select>
      <select id="mode-select" title="Game Mode">
        <option value="classic">Classic Mode (Wrench Drops)</option>
        <option value="fortress">Fortress Mode (Fixed 800 CP)</option>
      </select>
      <select id="global-target" title="Global Target Priority">
        <option value="first">Target: Closest to Base</option>
        <option value="strong">Target: Strongest</option>
        <option value="weak">Target: Weakest</option>
        <option value="air">Target: Air First</option>
      </select>
      <button id="wave-btn">Next Wave</button>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game"></canvas>
    <div id="toast">Swipe wrenches to earn combo CP!</div>
    <div id="inspector">
      <strong id="insp-title">Unit</strong>
      <div id="insp-stats">Lvl 1</div>
      <div class="inspector-row">
        <button id="upg-btn">Upgrade</button>
        <button id="sell-btn">Sell</button>
        <button id="close-insp">X</button>
      </div>
    </div>
  </div>

  <div id="bottombar">
    <button class="build-btn selected" data-type="trench">Trench<span class="cost">15 CP</span></button>
    <button class="build-btn" data-type="power">Generator<span class="cost">40 CP</span></button>
    <button class="build-btn" data-type="infantry">Infantry<span class="cost">35 CP</span></button>
    <button class="build-btn" data-type="heavy">Heavy Gunner<span class="cost">60 CP</span></button>
    <button class="build-btn" data-type="df9">DF.9 Turret<span class="cost">75 CP (Pwr)</span></button>
    <button class="build-btn" data-type="laser">Laser Tower<span class="cost">100 CP (Pwr)</span></button>
    <button class="build-btn" data-type="ion">Ion Cannon<span class="cost">135 CP (Pwr)</span></button>
    <button class="build-btn" data-type="speeder">Snowspeeder<span class="cost">160 CP (Pwr)</span></button>
  </div>
</div>

<script>
const COLS = 16, ROWS = 9;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const UNIT_DEFS = {
  trench:   { name: 'Trench', cost: 15, reqPower: false, range: 0, dmg: 0, rate: 0, color: '#8d99ae', blocks: false },
  power:    { name: 'Power Gen', cost: 40, reqPower: false, range: 2.6, dmg: 0, rate: 0, color: '#00b4d8', blocks: true },
  infantry: { name: 'Rebel Trooper', cost: 35, reqPower: false, range: 2.5, dmg: 9, rate: 28, color: '#52b788', air: true, ground: true, blocks: true },
  heavy:    { name: 'Heavy Weapon', cost: 60, reqPower: false, range: 3.1, dmg: 20, rate: 42, color: '#2d6a4f', air: true, ground: true, blocks: true },
  df9:      { name: 'DF.9 Battery', cost: 75, reqPower: true, range: 3.4, dmg: 26, rate: 25, color: '#e76f51', air: false, ground: true, blocks: true },
  laser:    { name: 'Atgar Laser', cost: 100, reqPower: true, range: 4.2, dmg: 52, rate: 50, color: '#e63946', air: true, ground: true, blocks: true },
  ion:      { name: 'Ion Cannon', cost: 135, reqPower: true, range: 4.8, dmg: 65, rate: 68, color: '#4361ee', air: true, ground: true, slow: 0.45, blocks: true },
  speeder:  { name: 'Snowspeeder Pad', cost: 160, reqPower: true, range: 5.5, dmg: 95, rate: 80, color: '#f77f00', air: true, ground: true, towCable: true, blocks: true }
};

const MAPS = [
  { name: 'Echo Perimeter', rocks: [[4,2],[4,3],[4,5],[4,6],[10,1],[10,7]] },
  { name: 'Twin Ridge Choke', rocks: [[5,0],[5,1],[5,2],[5,6],[5,7],[5,8],[11,2],[11,3],[11,4],[11,5],[11,6]] },
  { name: 'Ice Cavern Labyrinth', rocks: [[3,1],[3,2],[3,3],[3,4],[7,4],[7,5],[7,6],[7,7],[11,1],[11,2],[11,3],[11,4],[11,5]] },
  { name: 'Dual Generator Core', rocks: [[4,4],[5,4],[6,4],[9,2],[9,3],[9,5],[9,6],[12,4]] },
  { name: 'Outpost Beta Blitz', rocks: [[6,1],[6,2],[6,6],[6,7],[10,3],[10,4],[10,5]] }
];

let state = {
  mapIdx: 0, mode: 'classic', cp: 250, shield: 100, wave: 0, maxWaves: 10, score: 0,
  buildType: 'trench', globalTarget: 'first', selectedCell: null,
  grid: [], enemies: [], projectiles: [], wrenches: [], swipeTrail: [],
  waveActive: false, spawnQueue: [], spawnTimer: 0, flowField: []
};

function initGrid() {
  state.grid = Array.from({ length: ROWS }, (_, r) =>
    Array.from({ length: COLS }, (_, c) => ({
      r, c, rock: false, trench: false, unit: null
    }))
  );
  const map = MAPS[state.mapIdx];
  map.rocks.forEach(([c, r]) => { if (state.grid[r] && state.grid[r][c]) state.grid[r][c].rock = true; });
  state.cp = state.mode === 'fortress' ? 800 : 250;
  state.shield = 100; state.wave = 0; state.score = 0;
  state.enemies = []; state.projectiles = []; state.wrenches = []; state.spawnQueue = [];
  state.waveActive = false; state.selectedCell = null;
  computeFlowField();
  updateUI();
}

function computeFlowField() {
  const dist = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
  const q = [];
  for (let r = 0; r < ROWS; r++) {
    dist[r][COLS - 1] = 0;
    q.push([r, COLS - 1]);
  }
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while (q.length) {
    const [r, c] = q.shift();
    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      const cell = state.grid[nr][nc];
      if (cell.rock || (cell.unit && UNIT_DEFS[cell.unit.type].blocks && !cell.trench)) continue;
      const stepCost = cell.trench ? 1.4 : 1;
      if (dist[r][c] + stepCost < dist[nr][nc]) {
        dist[nr][nc] = dist[r][c] + stepCost;
        q.push([nr, nc]);
      }
    }
  }
  state.flowField = dist;
  return dist.some((row, r) => row[0] < Infinity);
}

function isPowered(r, c) {
  for (let rr = 0; rr < ROWS; rr++) {
    for (let cc = 0; cc < COLS; cc++) {
      const u = state.grid[rr][cc].unit;
      if (u && u.type === 'power') {
        const d = Math.hypot(rr - r, cc - c);
        if (d <= UNIT_DEFS.power.range + (u.level - 1) * 0.6) return true;
      }
    }
  }
  return false;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(showToast.tid);
  showToast.tid = setTimeout(() => t.style.opacity = '0', 2200);
}

function startWave() {
  if (state.waveActive) return;
  if (state.wave >= state.maxWaves) { initGrid(); return; }
  state.wave++;
  state.waveActive = true;
  const count = 6 + state.wave * 3;
  state.spawnQueue = [];
  for (let i = 0; i < count; i++) {
    const roll = Math.random();
    let type = 'snowtrooper';
    if (state.wave >= 2 && roll > 0.65) type = 'probedroid';
    if (state.wave >= 3 && roll > 0.78) type = 'atst';
    if (state.wave >= 4 && roll > 0.86) type = 'tie';
    if (state.wave >= 5 && i === count - 1) type = 'atat';
    state.spawnQueue.push(type);
  }
  showToast(`Wave ${state.wave} Incoming!`);
  updateUI();
}

function spawnEnemy(type) {
  const defs = {
    snowtrooper: { name: 'Snowtrooper', hp: 55 + state.wave * 18, speed: 0.028, dmg: 5, cp: 15, air: false, radius: 0.22, color: '#f8f9fa' },
    probedroid:  { name: 'Probe Droid', hp: 45 + state.wave * 15, speed: 0.042, dmg: 5, cp: 18, air: false, radius: 0.2, color: '#495057' },
    atst:        { name: 'AT-ST Scout', hp: 180 + state.wave * 55, speed: 0.022, dmg: 12, cp: 35, air: false, radius: 0.32, color: '#adb5bd' },
    tie:         { name: 'TIE Fighter', hp: 95 + state.wave * 30, speed: 0.05, dmg: 10, cp: 30, air: true, radius: 0.26, color: '#212529' },
    atat:        { name: 'AT-AT Walker', hp: 750 + state.wave * 220, speed: 0.011, dmg: 35, cp: 90, air: false, radius: 0.44, color: '#6c757d' }
  };
  const d = defs[type];
  let r = Math.floor(Math.random() * ROWS);
  state.enemies.push({
    ...d, type, maxHp: d.hp, r: r + 0.5, c: 0.2, slowTimer: 0
  });
}

function updateGame() {
  if (state.waveActive) {
    if (state.spawnQueue.length > 0) {
      state.spawnTimer--;
      if (state.spawnTimer <= 0) {
        spawnEnemy(state.spawnQueue.shift());
        state.spawnTimer = 42;
      }
    } else if (state.enemies.length === 0) {
      state.waveActive = false;
      if (state.wave === state.maxWaves) showToast('Victory! Echo Base Evacuated! Tap Next Wave to Replay.');
      else showToast(`Wave ${state.wave} Cleared!`);
      updateUI();
    }
  }

  // Update Enemies
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    const spd = e.slowTimer > 0 ? e.speed * 0.5 : e.speed;
    if (e.slowTimer > 0) e.slowTimer--;

    if (e.air) {
      e.c += spd;
    } else {
      const cr = Math.min(ROWS - 1, Math.max(0, Math.floor(e.r)));
      const cc = Math.min(COLS - 1, Math.max(0, Math.floor(e.c)));
      let bestR = cr, bestC = cc + 1, bestVal = Infinity;
      const dirs = [[0,1],[1,0],[-1,0],[0,-1]];
      for (const [dr, dc] of dirs) {
        const nr = cr + dr, nc = cc + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
          if (state.flowField[nr][nc] < bestVal) {
            bestVal = state.flowField[nr][nc];
            bestR = nr; bestC = nc;
          }
        }
      }
      const tr = bestR + 0.5, tc = bestC + 0.5;
      const ang = Math.atan2(tr - e.r, tc - e.c);
      e.r += Math.sin(ang) * spd;
      e.c += Math.cos(ang) * spd;
    }

    if (e.c >= COLS - 0.6) {
      state.shield = Math.max(0, state.shield - e.dmg);
      state.enemies.splice(i, 1);
      updateUI();
      if (state.shield <= 0) {
        showToast('Shield Generator Destroyed! Resetting Sector...');
        setTimeout(initGrid, 1500);
        return;
      }
    }
  }

  // Update Towers
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = state.grid[r][c];
      const u = cell.unit;
      if (!u) continue;
      const def = UNIT_DEFS[u.type];
      if (def.dmg === 0) continue;
      if (def.reqPower && !isPowered(r, c)) continue;

      if (u.cooldown > 0) { u.cooldown--; continue; }

      const range = def.range + (u.level - 1) * 0.45 + (cell.trench ? 0.4 : 0);
      const candidates = state.enemies.filter(e => {
        if (e.air && !def.air) return false;
        if (!e.air && !def.ground) return false;
        return Math.hypot(e.r - (r + 0.5), e.c - (c + 0.5)) <= range;
      });

      if (candidates.length > 0) {
        const prio = state.globalTarget;
        candidates.sort((a, b) => {
          if (prio === 'air' && a.air !== b.air) return a.air ? -1 : 1;
          if (prio === 'strong') return b.hp - a.hp;
          if (prio === 'weak') return a.hp - b.hp;
          return b.c - a.c;
        });
        const target = candidates[0];
        u.cooldown = Math.max(10, Math.floor(def.rate * Math.pow(0.88, u.level - 1)));
        let dmg = def.dmg * (1 + (u.level - 1) * 0.45) * (cell.trench ? 1.2 : 1);
        if (def.towCable && target.type === 'atat' && u.level >= 2) dmg *= 2.5;
        state.projectiles.push({
          r: r + 0.5, c: c + 0.5, tr: target.r, tc: target.c,
          color: def.color, life: 6
        });
        target.hp -= dmg;
        if (def.slow) target.slowTimer = 70;
        if (target.hp <= 0) {
          const idx = state.enemies.indexOf(target);
          if (idx !== -1) state.enemies.splice(idx, 1);
          state.score += target.cp * 10;
          if (state.mode === 'classic') {
            state.wrenches.push({ r: target.r, c: target.c, val: target.cp, ttl: 480, maxTtl: 480 });
          } else {
            state.wrenches.push({ r: target.r, c: target.c, val: target.cp * 5, ttl: 420, maxTtl: 420, scoreOnly: true });
          }
          updateUI();
        }
      }
    }
  }

  // Update Wrenches
  for (let i = state.wrenches.length - 1; i >= 0; i--) {
    state.wrenches[i].ttl--;
    if (state.wrenches[i].ttl <= 0) state.wrenches.splice(i, 1);
  }

  // Update Projectiles
  for (let i = state.projectiles.length - 1; i >= 0; i--) {
    state.projectiles[i].life--;
    if (state.projectiles[i].life <= 0) state.projectiles.splice(i, 1);
  }
}

function draw() {
  const W = canvas.width, H = canvas.height;
  const cw = W / COLS, ch = H / ROWS;
  ctx.clearRect(0, 0, W, H);

  // Hoth Snowfield Grid
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = state.grid[r][c];
      ctx.fillStyle = (r + c) % 2 === 0 ? '#d8ecfa' : '#cce3f5';
      if (c === 0) ctx.fillStyle = '#f4a26133';
      if (c === COLS - 1) ctx.fillStyle = '#4cc9f044';
      ctx.fillRect(c * cw, r * ch, cw, ch);
      ctx.strokeStyle = '#b8d4eb';
      ctx.strokeRect(c * cw, r * ch, cw, ch);

      if (cell.rock) {
        ctx.fillStyle = '#5c6b73';
        ctx.beginPath();
        ctx.roundRect(c * cw + 3, r * ch + 3, cw - 6, ch - 6, 6);
        ctx.fill();
      }
      if (cell.trench) {
        ctx.fillStyle = '#6c757d';
        ctx.fillRect(c * cw + 4, r * ch + 4, cw - 8, ch - 8);
        ctx.strokeStyle = '#343a40';
        ctx.strokeRect(c * cw + 6, r * ch + 6, cw - 12, ch - 12);
      }
    }
  }

  // Power Radii
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const u = state.grid[r][c].unit;
      if (u && u.type === 'power') {
        const rad = (UNIT_DEFS.power.range + (u.level - 1) * 0.6) * ((cw + ch) / 2);
        ctx.fillStyle = 'rgba(0, 180, 216, 0.11)';
        ctx.strokeStyle = 'rgba(0, 180, 216, 0.45)';
        ctx.beginPath();
        ctx.arc((c + 0.5) * cw, (r + 0.5) * ch, rad, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }
    }
  }

  // Units
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const u = state.grid[r][c].unit;
      if (!u) continue;
      const def = UNIT_DEFS[u.type];
      const powered = !def.reqPower || isPowered(r, c);
      ctx.fillStyle = powered ? def.color : '#6c757d';
      ctx.beginPath();
      ctx.arc((c + 0.5) * cw, (r + 0.5) * ch, Math.min(cw, ch) * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(powered ? `L${u.level}` : 'OFF', (c + 0.5) * cw, (r + 0.55) * ch);
    }
  }

  // Enemies
  state.enemies.forEach(e => {
    const x = e.c * cw, y = e.r * ch;
    const rad = e.radius * Math.min(cw, ch);
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = e.air ? '#ffd166' : '#c1121f';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.lineWidth = 1;

    // HP Bar
    const bw = cw * 0.7;
    ctx.fillStyle = '#000';
    ctx.fillRect(x - bw / 2, y - rad - 7, bw, 4);
    ctx.fillStyle = '#ef233c';
    ctx.fillRect(x - bw / 2, y - rad - 7, bw * Math.max(0, e.hp / e.maxHp), 4);
  });

  // Projectiles
  state.projectiles.forEach(p => {
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.c * cw, p.r * ch);
    ctx.lineTo(p.tc * cw, p.tr * ch);
    ctx.stroke();
    ctx.lineWidth = 1;
  });

  // Wrench Bonus Tokens
  state.wrenches.forEach(w => {
    const x = w.c * cw, y = w.r * ch;
    const ratio = Math.max(0.35, w.ttl / w.maxTtl);
    ctx.fillStyle = w.scoreOnly ? `rgba(76, 201, 240, ${ratio})` : `rgba(255, 209, 102, ${ratio})`;
    ctx.beginPath();
    ctx.arc(x, y, Math.min(cw, ch) * 0.26, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔧', x, y + 4);
  });
}

function collectWrenchesAt(x, y, isSwipe) {
  const cw = canvas.width / COLS, ch = canvas.height / ROWS;
  let collected = 0;
  for (let i = state.wrenches.length - 1; i >= 0; i--) {
    const w = state.wrenches[i];
    if (Math.hypot(w.c * cw - x, w.r * ch - y) < Math.min(cw, ch) * 0.55) {
      const decayFactor = Math.max(0.4, w.ttl / w.maxTtl);
      const gain = Math.round(w.val * decayFactor * (isSwipe ? 1.25 : 1));
      if (w.scoreOnly) state.score += gain;
      else state.cp += gain;
      state.wrenches.splice(i, 1);
      collected++;
    }
  }
  if (collected > 0) updateUI();
  return collected > 0;
}

function handleCellTap(r, c) {
  if (r < 0 || r >= ROWS || c <= 0 || c >= COLS - 1) return;
  const cell = state.grid[r][c];
  if (cell.rock) return;

  if (cell.unit) {
    state.selectedCell = cell;
    const insp = document.getElementById('inspector');
    const def = UNIT_DEFS[cell.unit.type];
    document.getElementById('insp-title').textContent = `${def.name} (Lvl ${cell.unit.level})`;
    const upgCost = Math.round(def.cost * 0.75 * cell.unit.level);
    document.getElementById('insp-stats').textContent = cell.unit.level < 3 ? `Upgrade Cost: ${upgCost} CP` : 'Max Level Reached';
    insp.style.display = 'flex';
    return;
  }

  const def = UNIT_DEFS[state.buildType];
  if (state.cp < def.cost) { showToast('Not enough Command Points!'); return; }

  if (state.buildType === 'trench') {
    if (cell.trench) return;
    cell.trench = true;
    state.cp -= def.cost;
    computeFlowField();
    updateUI();
    return;
  }

  if (def.reqPower && !isPowered(r, c)) {
    showToast('Must place inside a Power Generator radius!');
    return;
  }

  cell.unit = { type: state.buildType, level: 1, cooldown: 0 };
  if (!computeFlowField()) {
    cell.unit = null;
    computeFlowField();
    showToast('Cannot completely block Imperial path!');
    return;
  }
  state.cp -= def.cost;
  updateUI();
}

function updateUI() {
  document.getElementById('cp-val').textContent = state.cp;
  document.getElementById('shield-val').textContent = state.shield;
  document.getElementById('wave-val').textContent = `${state.wave}/${state.maxWaves}`;
  document.getElementById('score-val').textContent = state.score;
}

function resize() {
  const rect = document.getElementById('canvas-wrap').getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
window.addEventListener('resize', resize);

let isPointerDown = false;
canvas.addEventListener('pointerdown', e => {
  isPointerDown = true;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (collectWrenchesAt(x, y, false)) return;
  const c = Math.floor((x / canvas.width) * COLS);
  const r = Math.floor((y / canvas.height) * ROWS);
  handleCellTap(r, c);
});

canvas.addEventListener('pointermove', e => {
  if (!isPointerDown) return;
  const rect = canvas.getBoundingClientRect();
  collectWrenchesAt(e.clientX - rect.left, e.clientY - rect.top, true);
});
window.addEventListener('pointerup', () => { isPointerDown = false; });

document.querySelectorAll('.build-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    state.buildType = btn.dataset.type;
    document.getElementById('inspector').style.display = 'none';
  });
});

document.getElementById('upg-btn').addEventListener('click', () => {
  const cell = state.selectedCell;
  if (!cell || !cell.unit || cell.unit.level >= 3) return;
  const def = UNIT_DEFS[cell.unit.type];
  const cost = Math.round(def.cost * 0.75 * cell.unit.level);
  if (state.cp < cost) { showToast('Not enough CP to upgrade!'); return; }
  state.cp -= cost;
  cell.unit.level++;
  document.getElementById('inspector').style.display = 'none';
  updateUI();
});

document.getElementById('sell-btn').addEventListener('click', () => {
  const cell = state.selectedCell;
  if (!cell || !cell.unit) return;
  const def = UNIT_DEFS[cell.unit.type];
  state.cp += Math.round(def.cost * 0.6 * cell.unit.level);
  cell.unit = null;
  computeFlowField();
  document.getElementById('inspector').style.display = 'none';
  updateUI();
});

document.getElementById('close-insp').addEventListener('click', () => {
  document.getElementById('inspector').style.display = 'none';
});

document.getElementById('wave-btn').addEventListener('click', startWave);
document.getElementById('map-select').addEventListener('change', e => { state.mapIdx = +e.target.value; initGrid(); });
document.getElementById('mode-select').addEventListener('change', e => { state.mode = e.target.value; initGrid(); });
document.getElementById('global-target').addEventListener('change', e => { state.globalTarget = e.target.value; });

resize();
initGrid();
function loop() { updateGame(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
