<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Siege of Frostfall</title>
<style>
  html,body{margin:0;height:100%;background:#0b1a2b;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;outline:none}
  #rot{position:fixed;left:0;right:0;top:0;padding:8px 12px;background:rgba(10,24,42,.92);color:#cfe6ff;
    font:600 13px system-ui,sans-serif;text-align:center;display:none;z-index:5}
  #rot button{margin-left:10px;background:#2a4a6b;color:#fff;border:0;border-radius:6px;padding:4px 10px;font:inherit}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Siege of Frostfall tower defense game"></canvas>
<div id="rot">Rotate your device to landscape for a bigger battlefield.<button id="rotx">OK</button></div>
<noscript>This game needs JavaScript.</noscript>
<script>
(()=>{
'use strict';
/* =====================================================================
   SIEGE OF FROSTFALL - an original tower-defense game for an ice world.
   Everything (art, audio, levels) is generated in code. No external assets.
   ===================================================================== */
const W=960,H=640,TS=40,COLS=24,ROWS=13,MY=40,BAR=MY+ROWS*TS; // map y 40..560
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let K=1;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);K=cv.width/W;
  const rot=document.getElementById('rot');
  if(!rotDismissed&&innerHeight>innerWidth*1.1)rot.style.display='block';else rot.style.display='none';
}
let rotDismissed=false;
document.getElementById('rotx').onclick=()=>{rotDismissed=true;resize()};
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ---------- utils ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function txt(s,x,y,size=14,col='#fff',align='left',weight=700){ctx.font=`${weight} ${size}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}

/* ---------- save ---------- */
const SKEY='frostfall_v1';
let save={stars:[0,0,0],unlocked:1,muted:false};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&Array.isArray(s.stars))save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}}

/* ---------- audio ---------- */
let AC=null,noiseBuf=null;const lastSfx={};
function audioInit(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
}
function tone(f0,f1,d,type='square',v=.04,dl=0){
  if(save.muted||!AC)return;const t=AC.currentTime+dl;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);
}
function boom(d=.4,v=.12,f=900){
  if(save.muted||!AC)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;fl.type='lowpass';fl.frequency.setValueAtTime(f,t);fl.frequency.exponentialRampToValueAtTime(80,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d);
}
const SFX={
  blaster:()=>tone(1100,350,.07,'square',.02),
  cryo:()=>tone(700,1300,.12,'sine',.04),
  missile:()=>{tone(200,90,.25,'sawtooth',.03);boom(.2,.04,1500)},
  ion:()=>{tone(160,900,.14,'sawtooth',.03);tone(900,120,.12,'square',.02,.05)},
  cannon:()=>{tone(120,40,.3,'square',.06);boom(.3,.1,600)},
  explode:()=>boom(.45,.14,900),
  big:()=>boom(.9,.22,500),
  build:()=>{tone(330,330,.06,'square',.05);tone(660,660,.1,'square',.05,.06)},
  upgrade:()=>{tone(440,440,.07,'triangle',.07);tone(660,660,.07,'triangle',.07,.07);tone(880,880,.12,'triangle',.07,.14)},
  sell:()=>tone(500,200,.18,'triangle',.06),
  coin:()=>tone(1400,1900,.06,'square',.02),
  leak:()=>{tone(220,90,.35,'sawtooth',.09)},
  err:()=>tone(160,120,.14,'square',.05),
  wave:()=>{tone(220,220,.15,'sawtooth',.05);tone(330,330,.25,'sawtooth',.05,.15)},
  orbital:()=>{tone(1800,200,.6,'sine',.07);},
  freeze:()=>{tone(1500,300,.8,'sine',.06);tone(2200,500,.6,'triangle',.03,.1)},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,f,.22,'triangle',.08,i*.14))},
  lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,f*.9,.3,'sawtooth',.06,i*.2))},
  click:()=>tone(600,600,.04,'square',.03)
};
function sfx(n,gap=.04){const t=performance.now()/1000;if(lastSfx[n]&&t-lastSfx[n]<gap)return;lastSfx[n]=t;try{SFX[n]()}catch(e){}}

/* ---------- game data ---------- */
const T={
  blaster:{name:'Blaster',cost:60,range:120,dmg:9,rate:3.2,spd:560,air:true,col:'#7fd6ff',desc:'Rapid fire. Hits ground and air.'},
  cryo:{name:'Cryo',cost:80,range:112,dmg:4,rate:1.5,spd:380,air:true,slow:.5,slowT:1.8,col:'#bff3ff',desc:'Chills targets, slowing them. Ground and air.'},
  missile:{name:'Missile',cost:130,range:175,dmg:32,rate:.75,spd:300,air:false,splash:56,col:'#ffb060',desc:'Long range splash damage. Ground only.'},
  ion:{name:'Ion Coil',cost:160,range:132,dmg:24,rate:.95,air:true,chain:3,pierce:true,col:'#d3a6ff',desc:'Chain lightning that ignores armour. Ground and air.'},
  cannon:{name:'Heavy',cost:210,range:152,dmg:95,rate:.42,spd:620,air:false,col:'#ff7a7a',desc:'Huge damage to armoured foes. Ground only.'}
};
const TKEYS=Object.keys(T);
const LVCOL=['#cfd8e3','#7ee6a1','#ffd45e','#ff8a5e'];
const E={
  trooper:{hp:42,spd:46,armor:0,r:8,reward:6,dmg:1,air:false,name:'Trooper'},
  bike:{hp:30,spd:98,armor:0,r:10,reward:8,dmg:1,air:false,name:'Speeder'},
  drone:{hp:26,spd:72,armor:0,r:9,reward:7,dmg:1,air:true,name:'Drone'},
  strider:{hp:300,spd:32,armor:6,r:15,reward:24,dmg:2,air:false,name:'Strider'},
  titan:{hp:2400,spd:22,armor:12,r:24,reward:130,dmg:6,air:false,name:'Titan'}
};
const P=(a)=>a;
const LEVELS=[
  {name:'Echo Ridge',sub:'Easy · 10 waves',waves:10,cred:270,lives:20,seed:11,hp:1,
   paths:[P([[-1,2],[5,2],[5,9],[11,9],[11,3],[17,3],[17,10],[24,10]])]},
  {name:'Glacier Pass',sub:'Medium · 14 waves',waves:14,cred:300,lives:20,seed:23,hp:1.3,
   paths:[P([[-1,10],[4,10],[4,3],[9,3],[9,8],[14,8],[14,2],[19,2],[19,9],[24,9]])]},
  {name:'Frozen Gorge',sub:'Hard · 18 waves · two entrances',waves:18,cred:380,lives:25,seed:37,hp:1.6,
   paths:[P([[-1,2],[7,2],[7,6],[13,6],[13,2],[19,2],[19,9],[24,9]]),
          P([[-1,10],[7,10],[7,6],[13,6],[13,2],[19,2],[19,9],[24,9]])]}
];
function makeWave(n){
  const g=[];
  g.push({t:'trooper',c:5+n*2,gap:.7});
  if(n>=3)g.push({t:'bike',c:2+Math.floor(n*1.2),gap:.5});
  if(n>=5)g.push({t:'drone',c:3+n,gap:.45});
  if(n>=7)g.push({t:'strider',c:1+Math.floor((n-6)/1.5),gap:1.8});
  if(n%5===0)g.push({t:'titan',c:Math.floor(n/5),gap:4});
  return g;
}

/* ---------- level build ---------- */
function ptx(c,r){return[c*TS+TS/2,MY+r*TS+TS/2]}
function buildLevel(i){
  const L=LEVELS[i],rnd=mulberry(L.seed);
  const grid=[];for(let r=0;r<ROWS;r++){grid.push(new Array(COLS).fill(0))}
  const paths=L.paths.map(wp=>{
    const pts=wp.map(([c,r])=>ptx(c,r));
    for(let k=0;k<wp.length-1;k++){
      const[a,b]=[wp[k],wp[k+1]];
      for(let c=Math.min(a[0],b[0]);c<=Math.max(a[0],b[0]);c++)for(let r=Math.min(a[1],b[1]);r<=Math.max(a[1],b[1]);r++)
        if(c>=0&&c<COLS&&r>=0&&r<ROWS)grid[r][c]=1;
    }
    const cum=[0];for(let k=1;k<pts.length;k++)cum.push(cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]));
    return{pts,cum,total:cum[cum.length-1]};
  });
  const decor=[];
  let tries=0;
  while(decor.length<34&&tries++<400){
    const c=Math.floor(rnd()*COLS),r=Math.floor(rnd()*ROWS);
    if(grid[r][c]!==0)continue;
    const kind=['rock','pine','crystal','pine','rock'][Math.floor(rnd()*5)];
    grid[r][c]=2;decor.push({c,r,kind,s:.8+rnd()*.4,a:rnd()});
  }
  const bg=renderBG(L,grid,paths,decor,rnd);
  return{grid,paths,decor,bg};
}
function renderBG(L,grid,paths,decor,rnd){
  const S=2,cvs=document.createElement('canvas');cvs.width=W*S;cvs.height=ROWS*TS*S;
  const b=cvs.getContext('2d');b.scale(S,S);b.translate(0,-MY);
  let g=b.createLinearGradient(0,MY,0,BAR);g.addColorStop(0,'#c9ddee');g.addColorStop(1,'#eaf4fc');
  b.fillStyle=g;b.fillRect(0,MY,W,ROWS*TS);
  // drifts
  for(let i=0;i<46;i++){
    const x=rnd()*W,y=MY+rnd()*ROWS*TS,rx=40+rnd()*110,ry=14+rnd()*34;
    const rg=b.createRadialGradient(x,y,0,x,y,rx);const lt=rnd()<.6;
    rg.addColorStop(0,lt?'rgba(255,255,255,.55)':'rgba(150,185,220,.3)');rg.addColorStop(1,'rgba(255,255,255,0)');
    b.fillStyle=rg;b.save();b.translate(x,y);b.scale(1,ry/rx);b.translate(-x,-y);b.beginPath();b.arc(x,y,rx,0,TAU);b.fill();b.restore();
  }
  // frozen pools
  for(let i=0;i<6;i++){
    const x=rnd()*W,y=MY+rnd()*ROWS*TS,rx=30+rnd()*50,ry=14+rnd()*22;
    b.fillStyle='rgba(140,196,235,.38)';b.beginPath();b.ellipse(x,y,rx,ry,rnd()*.5,0,TAU);b.fill();
    b.strokeStyle='rgba(255,255,255,.6)';b.lineWidth=1.5;b.beginPath();b.ellipse(x-2,y-2,rx*.8,ry*.7,0,3.4,5.2);b.stroke();
  }
  // snow speckle
  for(let i=0;i<4200;i++){
    b.fillStyle=rnd()<.55?'rgba(255,255,255,.7)':'rgba(130,170,210,.25)';
    const x=rnd()*W,y=MY+rnd()*ROWS*TS;b.beginPath();b.arc(x,y,.4+rnd()*1.5,0,TAU);b.fill();
  }
  // path
  const strokePath=(w,col)=>{b.lineWidth=w;b.strokeStyle=col;b.lineJoin='round';b.lineCap='round';
    for(const p of paths){b.beginPath();p.pts.forEach(([x,y],i)=>i?b.lineTo(x,y):b.moveTo(x,y));b.stroke()}};
  strokePath(50,'rgba(80,110,140,.35)');
  strokePath(46,'#8198af');strokePath(40,'#a3b7ca');strokePath(32,'#b6c7d7');
  // tracks & grit on path
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===1){
    for(let k=0;k<26;k++){
      const x=c*TS+rnd()*TS,y=MY+r*TS+rnd()*TS;
      b.fillStyle=rnd()<.5?'rgba(70,90,115,.32)':'rgba(255,255,255,.4)';
      b.beginPath();b.ellipse(x,y,1+rnd()*3,.6+rnd()*1.4,rnd()*3,0,TAU);b.fill();
    }
  }
  // subtle tile hints
  b.strokeStyle='rgba(120,150,185,.09)';b.lineWidth=1;
  for(let c=0;c<=COLS;c++){b.beginPath();b.moveTo(c*TS,MY);b.lineTo(c*TS,BAR);b.stroke()}
  for(let r=0;r<=ROWS;r++){b.beginPath();b.moveTo(0,MY+r*TS);b.lineTo(W,MY+r*TS);b.stroke()}
  // decor (y-sorted)
  decor.sort((a,c)=>a.r-c.r);
  for(const d of decor){
    const[x,y]=ptx(d.c,d.r);b.save();b.translate(x,y+8);b.scale(d.s,d.s);
    b.fillStyle='rgba(60,90,130,.25)';b.beginPath();b.ellipse(3,6,15,6,0,0,TAU);b.fill();
    if(d.kind==='rock'){
      b.fillStyle='#667584';b.beginPath();b.moveTo(-15,6);b.lineTo(-10,-8);b.lineTo(-1,-14);b.lineTo(10,-9);b.lineTo(16,6);b.closePath();b.fill();
      b.fillStyle='#8696a6';b.beginPath();b.moveTo(-10,-8);b.lineTo(-1,-14);b.lineTo(2,2);b.lineTo(-8,6);b.closePath();b.fill();
      b.fillStyle='#f6fbff';b.beginPath();b.moveTo(-11,-6);b.lineTo(-1,-14);b.lineTo(10,-9);b.lineTo(5,-6);b.lineTo(-2,-8);b.lineTo(-7,-3);b.closePath();b.fill();
    }else if(d.kind==='pine'){
      b.fillStyle='#5a4a3c';b.fillRect(-2,2,4,7);
      for(let k=0;k<3;k++){const yy=-2-k*9,w=15-k*3.5;
        b.fillStyle='#2c5a5e';b.beginPath();b.moveTo(0,yy-12);b.lineTo(w,yy+4);b.lineTo(-w,yy+4);b.closePath();b.fill();
        b.fillStyle='#f4fbff';b.beginPath();b.moveTo(0,yy-12);b.lineTo(w*.55,yy-3);b.lineTo(w*.15,yy-1);b.lineTo(-w*.2,yy-4);b.lineTo(-w*.55,yy-3);b.closePath();b.fill();}
    }else{
      const cg=b.createLinearGradient(-12,-20,12,8);cg.addColorStop(0,'#e8ffff');cg.addColorStop(1,'#5cb4d8');
      [[-9,4,7,18],[0,6,9,28],[9,4,6,15]].forEach(([cx,by,w,h])=>{
        b.fillStyle=cg;b.beginPath();b.moveTo(cx-w/2,by);b.lineTo(cx-w/3,by-h);b.lineTo(cx,by-h-5);b.lineTo(cx+w/3,by-h);b.lineTo(cx+w/2,by);b.closePath();b.fill();
        b.strokeStyle='rgba(255,255,255,.8)';b.lineWidth=1;b.stroke();});
    }
    b.restore();
  }
  return cvs;
}

/* ---------- state ---------- */
let scene='menu',G=null,menuT=0,showHelp=false,L=null,LV=null;
const ptr={x:-1,y:-1,type:'mouse'};
let btns=[];
const snow=[];for(let i=0;i<150;i++)snow.push({x:Math.random()*W,y:Math.random()*H,s:.6+Math.random()*2,v:14+Math.random()*34,ph:Math.random()*6});

function startLevel(i){
  const lv=LEVELS[i];L=lv;LV=buildLevel(i);
  G={idx:i,towers:[],enemies:[],proj:[],parts:[],texts:[],bolts:[],strikes:[],queue:[],
     towerAt:{},credits:lv.cred,lives:lv.lives,lives0:lv.lives,wave:0,timer:25,clock:0,
     sel:null,build:null,ghost:null,targeting:false,speed:1,paused:false,over:null,
     freezeT:0,orbCd:0,frzCd:0,banner:null,wavePending:{},baseHit:0,kills:0,hint:i===0,shake:0};
  scene='game';sfx('click');
}
function startWave(early){
  const n=++G.wave;
  if(early){const b=Math.max(0,Math.floor(G.timer*.5));if(b>0){G.credits+=b;ftext(W/2,80,'+'+b+' early bonus','#ffe27a')}}
  const groups=makeWave(n);let t=G.clock+.4,idx=0,count=0;
  for(const g of groups){for(let k=0;k<g.c;k++){G.queue.push({at:t,t:g.t,path:idx++%LV.paths.length,wave:n});t+=g.gap;count++}t+=1.4}
  G.wavePending[n]=count;G.timer=G.wave<L.waves?24:0;
  G.banner={txt:n===L.waves?'FINAL WAVE':'WAVE '+n,t:2.2};sfx('wave');
  if(G.hint)G.hint=false;
}
function stats(tw){const b=T[tw.type],l=tw.lv;
  return{dmg:b.dmg*(1+.65*l),range:b.range*(1+.08*l),rate:b.rate*(1+.12*l),splash:b.splash?b.splash*(1+.1*l):0,
    chain:b.chain?b.chain+(l>>1):0,slow:b.slow?Math.max(.2,b.slow-.07*l):1,slowT:b.slowT||0}}
const upCost=tw=>Math.round(T[tw.type].cost*(.8+.45*tw.lv));
function posAt(p,d){
  const c=p.cum;let i=1;while(i<c.length-1&&c[i]<d)i++;
  const a=p.pts[i-1],b=p.pts[i],t=(d-c[i-1])/(c[i]-c[i-1]||1);
  return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,Math.atan2(b[1]-a[1],b[0]-a[0])];
}
function spawn(q){
  const b=E[q.t],hpm=L.hp*(1+.13*q.wave),p=LV.paths[q.path];
  const[x,y,a]=posAt(p,0);
  G.enemies.push({type:q.t,d:0,path:q.path,x,y,ang:a,hp:b.hp*hpm,maxhp:b.hp*hpm,spd:b.spd*(.94+Math.random()*.12),armor:b.armor,
    r:b.r,reward:b.reward,dmg:b.dmg,air:b.air,slowT:0,slowF:1,anim:Math.random()*10,flash:0,wave:q.wave});
}
function ftext(x,y,s,col='#fff'){G.texts.push({x,y,s,col,t:1.1})}
function puff(x,y,n,col,sp=60,life=.5,size=2.5){
  for(let i=0;i<n&&G.parts.length<700;i++){const a=Math.random()*TAU,v=Math.random()*sp;
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:life*(.5+Math.random()*.7),m:life,s:size*(.6+Math.random()),col})}
}
function blast(x,y,r,col='#ffb04a'){
  puff(x,y,18,col,r*2.2,.55,3.5);puff(x,y,10,'#fff3c0',r*1.4,.3,3);
  G.parts.push({x,y,ring:true,r:r,t:.35,m:.35,col,vx:0,vy:0,s:0});
}
function dealDamage(e,dmg,pierce){
  if(e.hp<=0)return;
  const d=pierce?dmg:Math.max(dmg*.12,dmg-e.armor);
  e.hp-=d;e.flash=.12;
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.dead=true;G.credits+=e.reward;G.kills++;
  ftext(e.x,e.y-e.r-6,'+'+e.reward,'#ffe27a');
  if(e.type==='titan'){blast(e.x,e.y,60);G.shake=.6;sfx('big')}else{blast(e.x,e.y,e.r+4);sfx('explode',.05)}
  sfx('coin',.08);waveDone(e.wave);
}
function waveDone(w){
  if(--G.wavePending[w]===0){const b=20+w*3;G.credits+=b;ftext(W/2,110,'Wave '+w+' cleared  +'+b,'#9dffb0')}
}

/* ---------- placement & actions ---------- */
const towerAt=(c,r)=>G.towerAt[c+','+r];
function tryPlace(type,c,r){
  if(c<0||r<0||c>=COLS||r>=ROWS||LV.grid[r][c]!==0||towerAt(c,r)){ftext(c*TS+20,MY+r*TS,'Can\'t build here','#ff9a9a');sfx('err',.2);return false}
  const cost=T[type].cost;
  if(G.credits<cost){ftext(c*TS+20,MY+r*TS,'Not enough credits','#ff9a9a');sfx('err',.2);return false}

function useFreeze(){if(G.frzCd>0)return;G.freezeT=5;G.frzCd=48;sfx('freeze');ftext(W/2,120,'CRYO FIELD ACTIVE','#bff3ff')}

/* ---------- update ---------- */
function update(dt){
  G.clock+=dt;
  if(G.freezeT>0)G.freezeT-=dt;if(G.orbCd>0)G.orbCd-=dt;if(G.frzCd>0)G.frzCd-=dt;
  if(G.wave<L.waves){G.timer-=dt;if(G.timer<=0)startWave(false)}
  const q=G.queue;for(let i=0;i<q.length;){if(q[i].at<=G.clock){spawn(q[i]);q.splice(i,1)}else i++}
  // enemies
  for(const e of G.enemies){
    if(e.dead)continue;
    let sf=1;if(e.slowT>0){sf=e.slowF;e.slowT-=dt}
    if(G.freezeT>0)sf=Math.min(sf,.35);
    e.d+=e.spd*sf*dt;e.anim+=dt*(e.spd*sf/40);if(e.flash>0)e.flash-=dt;
    const p=LV.paths[e.path];
    if(e.d>=p.total){
      e.dead=true;G.lives-=e.dmg;G.baseHit=.5;G.shake=.3;sfx('leak',.1);ftext(W-70,e.y-20,'-'+e.dmg,'#ff7a7a');waveDone(e.wave);continue;
    }
    const[x,y,a]=posAt(p,e.d);e.x=x;e.y=y;e.ang=a;
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  // towers
  for(const tw of G.towers){
    tw.cd-=dt;if(tw.rec>0)tw.rec=Math.max(0,tw.rec-dt*40);
    const st=stats(tw),b=T[tw.type];let best=null,bv=0;
    const R=st.range;
    for(const e of G.enemies){
      if(e.air&&!b.air)continue;
      const dx=e.x-tw.x,dy=e.y-tw.y,rr2=(R+e.r)*(R+e.r);if(dx*dx+dy*dy>rr2)continue;
      const v=tw.mode===0?e.d:tw.mode===1?-e.d:e.hp;
      if(!best||v>bv){best=e;bv=v}
    }
    if(best){
      const want=Math.atan2(best.y-tw.y,best.x-tw.x);
      let da=want-tw.angle;da=Math.atan2(Math.sin(da),Math.cos(da));tw.angle+=da*Math.min(1,dt*16);
      if(tw.cd<=0){fire(tw,st,b,best);tw.cd=1/st.rate}
    }
  }
  // projectiles
  for(const p of G.proj){
    if(p.target&&!p.target.dead){p.tx=p.target.x;p.ty=p.target.y}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),step=p.spd*dt;
    if(p.kind==='missile'&&G.parts.length<600)G.parts.push({x:p.x,y:p.y,vx:0,vy:0,t:.35,m:.35,s:3,col:'#dfe8f0'});
    if(d<=step+(p.target&&!p.target.dead?p.target.r*.6:3)){hitProj(p);p.done=true}
    else{p.x+=dx/d*step;p.y+=dy/d*step;p.a=Math.atan2(dy,dx)}
  }
  G.proj=G.proj.filter(p=>!p.done);
  // strikes
  for(const s of G.strikes){
    s.t-=dt;
    if(s.t<=0){
      s.done=true;blast(s.x,s.y,80,'#9fd0ff');blast(s.x,s.y,45,'#fff');G.shake=.5;sfx('big');
      for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-s.x,e.y-s.y)<=86+e.r)dealDamage(e,260,true);
    }
  }
  G.strikes=G.strikes.filter(s=>!s.done);
  G.enemies=G.enemies.filter(e=>!e.dead);
  fx(dt);
  // end conditions
  if(G.lives<=0){G.lives=0;endGame(false)}
  else if(G.wave>=L.waves&&G.queue.length===0&&G.enemies.length===0)endGame(true);
}
function fx(dt){
  for(const p of G.parts){p.t-=dt;if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94}}
  G.parts=G.parts.filter(p=>p.t>0);
  for(const t of G.texts){t.t-=dt;t.y-=22*dt}G.texts=G.texts.filter(t=>t.t>0);
  for(const b of G.bolts)b.t-=dt;G.bolts=G.bolts.filter(b=>b.t>0);
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
  if(G.baseHit>0)G.baseHit-=dt;if(G.shake>0)G.shake-=dt;
}
function fire(tw,st,b,tg){
  tw.rec=4;sfx(tw.type,.05);
  const mx=tw.x+Math.cos(tw.angle)*16,my=tw.y+Math.sin(tw.angle)*16;
  if(tw.type==='ion'){
    const hit=[tg],pts=[[mx,my],[tg.x,tg.y]];let cur=tg,dm=st.dmg;
    for(let i=1;i<st.chain;i++){
      let n=null,nd=1e9;
      for(const e of G.enemies){if(hit.includes(e)||e.dead)continue;const d=Math.hypot(e.x-cur.x,e.y-cur.y);if(d<95&&d<nd){nd=d;n=e}}
      if(!n)break;hit.push(n);pts.push([n.x,n.y]);cur=n;
    }
    hit.forEach((e,i)=>{dealDamage(e,dm*Math.pow(.82,i),true);puff(e.x,e.y,5,'#e6c8ff',50,.3,2)});
    G.bolts.push({pts,t:.16,m:.16});return;
  }
  G.proj.push({kind:tw.type,x:mx,y:my,tx:tg.x,ty:tg.y,target:tg,spd:b.spd,dmg:st.dmg,splash:st.splash,slow:b.slow?st.slow:0,slowT:st.slowT,a:tw.angle,col:b.col,air:b.air});
}
function hitProj(p){
  if(p.splash){
    blast(p.tx,p.ty,p.splash*.6);sfx('explode',.06);
    for(const e of G.enemies){if(e.dead||(e.air&&!p.air))continue;const d=Math.hypot(e.x-p.tx,e.y-p.ty);
      if(d<=p.splash+e.r)dealDamage(e,p.dmg*(1-.5*d/(p.splash+e.r)),false)}
    G.shake=Math.max(G.shake,.12);
  }else if(p.target&&!p.target.dead){
    dealDamage(p.target,p.dmg,false);puff(p.tx,p.ty,p.kind==='cannon'?10:4,p.col,p.kind==='cannon'?90:50,.3,2);
    if(p.slow&&!p.target.dead){p.target.slowT=p.slowT;p.target.slowF=Math.min(p.slow,p.target.slowF<1&&p.target.slowT>0?p.target.slowF:1)}
  }
}
function endGame(win){
  if(G.over)return;G.over=win?'win':'lose';
  if(win){
    const f=G.lives/G.lives0,s=f>=.9?3:f>=.5?2:1;G.stars=s;
    save.stars[G.idx]=Math.max(save.stars[G.idx]||0,s);save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length,G.idx+2));persist();sfx('win');
  }else sfx('lose');
}

    for(const p of lv.paths){ctx.beginPath();p.forEach(([c,r],k)=>{const[px,py]=ptx(c,r);k?ctx.lineTo(px,py-MY):ctx.moveTo(px,py-MY)});ctx.stroke()}
    ctx.restore();
    if(locked){ctx.fillStyle='rgba(10,20,32,.6)';rr(x+12,y+12,w-24,150,10);ctx.fill();txt('LOCKED',x+w/2,y+87,22,'#9fb4c8','center',900)}
    txt(lv.name,x+w/2,y+195,24,'#fff','center',900);
    txt(lv.sub,x+w/2,y+224,13,'#9fc2e4','center',600);
    for(let k=0;k<3;k++){ctx.save();ctx.translate(x+w/2-44+k*44,y+262);ctx.scale(.7,.7);star(k<(save.stars[i]||0)?'#ffd84a':'#3a4d61');ctx.restore()}
    button(x+30,y+h-60,w-60,44,locked?'LOCKED':'DEPLOY',()=>{audioInit();startLevel(i)},{disabled:locked,size:17,col:'#2f8a5c',col2:'#1f6542'});
  }
  button(20,H-60,120,40,'BACK',()=>{scene='menu'},{size:15,col:'#555f6b',col2:'#3b434d'});
}

/* ---------- input ---------- */
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointermove',e=>{const p=toLogical(e);ptr.x=p.x;ptr.y=p.y;ptr.type=e.pointerType||'mouse'});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){ptr.x=-1;ptr.y=-1}});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();cv.focus&&cv.focus({preventScroll:true});
  const p=toLogical(e);ptr.x=p.x;ptr.y=p.y;ptr.type=e.pointerType||'mouse';
  if(clickUI())return;
  if(scene==='game'&&G&&!G.over&&!G.paused)worldTap(p,ptr.type);
},{passive:false});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(scene==='game'&&G){G.build=null;G.sel=null;G.targeting=false;G.ghost=null}});
function worldTap(p,type){
  if(p.y<MY||p.y>=BAR)return;
  const c=Math.floor(p.x/TS),r=Math.floor((p.y-MY)/TS);
  if(G.targeting){useOrbital(p.x,p.y);return}
  const tw=towerAt(c,r);
  if(tw){G.build=null;G.ghost=null;G.sel=G.sel===tw?null:tw;sfx('click',.05);return}
  if(G.build){
    if(type!=='mouse'&&!(G.ghost&&G.ghost.c===c&&G.ghost.r===r)){G.ghost={c,r};return}
    tryPlace(G.build,c,r);return;
  }
  G.sel=null;
}
addEventListener('keydown',e=>{
  if(scene!=='game'||!G)return;const k=e.key.toLowerCase();
  if(k>='1'&&k<='5'){const t=TKEYS[+k-1];G.build=G.build===t?null:t;G.sel=null;G.targeting=false;G.ghost=null;audioInit()}
  else if(k==='escape'){G.build=null;G.sel=null;G.targeting=false;G.ghost=null;if(G.paused)G.paused=false}
  else if(k==='p'||k===' '){if(!G.over)G.paused=!G.paused;e.preventDefault()}
  else if(k==='n')callWave();
  else if(k==='u')upgrade(G.sel);
  else if(k==='s'||k==='delete')sell(G.sel);
  else if(k==='f')G.speed=G.speed===1?2:G.speed===2?3:1;
  else if(k==='o'&&G.orbCd<=0){G.targeting=true;G.build=null;G.sel=null}
  else if(k==='c')useFreeze();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&scene==='game'&&!G.over)G.paused=true});

/* ---------- main loop ---------- */
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000);last=t;menuT+=dt;
  ctx.setTransform(K,0,0,K,0,0);ctx.clearRect(0,0,W,H);
  btns=[];
  if(scene==='menu')renderMenu();
  else if(scene==='levels')renderLevels();
  else if(G){
    if(!G.paused&&!G.over){for(let i=0;i<G.speed;i++)if(!G.over)update(dt)}
    else if(G.over)fx(dt);
    ctx.fillStyle='#0b1a2b';ctx.fillRect(0,0,W,H);
    renderWorld();drawSnow(G.paused?0:dt,!!G.over);
    renderHUD();renderBar();renderOverlays();
  }
}
resize();requestAnimationFrame(frame);
window.__frostfall={get G(){return G},get scene(){return scene},startLevel,LEVELS,T,E,tryPlace,startWave,update};
})();
</script>
